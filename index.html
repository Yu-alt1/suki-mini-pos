<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suki Mini POS เว็บไซต์สำหรับพนักงานรับออร์เดอร์ร้านสุกี้ขนาดเล็ก">
  <meta name="theme-color" content="#ffffff">
  <title>Suki Mini POS</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d252d;
      --muted: #5b6571;
      --border: #e3e7eb;
      --soft: #f7f7f5;
      --brand: #a4301f;
      --brand-dark: #842518;
      --brand-soft: #fbece8;
      --focus: #1d4ed8;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow: 0 10px 30px rgba(29, 37, 45, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Leelawadee UI", "Noto Sans Thai", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .header-inner {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 38px 24px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand-copy {
      max-width: 680px;
    }

    .eyebrow,
    .section-kicker {
      margin: 0 0 4px;
      color: var(--brand);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .brand-badge {
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--brand);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.06em;
      box-shadow: 0 12px 26px rgba(164, 48, 31, 0.22);
    }

    .page-layout {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 32px 24px 56px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
      gap: 28px;
      align-items: start;
    }

    .section-heading {
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .menu-list {
      display: grid;
      gap: 12px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      box-shadow: 0 4px 16px rgba(29, 37, 45, 0.035);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .menu-card:hover {
      border-color: #cbd2d9;
      box-shadow: 0 6px 20px rgba(29, 37, 45, 0.06);
    }

    .menu-marker {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .menu-marker--pork {
      background: #fbe9e4;
      color: #8f2b1c;
    }

    .menu-marker--beef {
      background: #f3ece1;
      color: #74451a;
    }

    .menu-marker--drink {
      background: #e4f1f3;
      color: #155e68;
    }

    .menu-info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .menu-name {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.4;
    }

    .menu-price {
      margin: 2px 0 0;
      color: var(--brand);
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .add-button {
      min-width: 82px;
      min-height: 48px;
      flex: 0 0 auto;
      padding: 10px 20px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 160ms ease, transform 120ms ease;
    }

    .add-button:hover {
      background: var(--brand-dark);
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .add-button:focus-visible,
    .clear-button:focus-visible {
      outline: 3px solid rgba(29, 78, 216, 0.5);
      outline-offset: 2px;
    }

    .cart-panel {
      position: sticky;
      top: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg);
      box-shadow: var(--shadow);
    }

    .cart-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .clear-button {
      min-height: 40px;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid #d6dbe0;
      border-radius: 10px;
      background: var(--bg);
      color: #4c5763;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 700;
      transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
    }

    .clear-button:hover:not(:disabled) {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .clear-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .empty-cart {
      margin: 22px 0;
      padding: 26px 14px;
      border: 1px dashed #d8dde2;
      border-radius: 12px;
      background: var(--soft);
      color: var(--muted);
      text-align: center;
      font-size: 0.93rem;
    }

    .cart-list {
      display: grid;
      gap: 10px;
      margin: 20px 0;
      padding: 0;
      list-style: none;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--soft);
    }

    .cart-item-name {
      min-width: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .cart-item-quantity {
      flex: 0 0 auto;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: #3e4853;
      font-size: 0.83rem;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .total-row {
      margin-top: 6px;
      padding-top: 16px;
      border-top: 2px solid var(--text);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .total-label {
      font-weight: 700;
    }

    .total-amount {
      margin: 0;
      color: var(--brand);
      font-size: clamp(1.85rem, 5vw, 2.25rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .total-unit {
      margin-left: 2px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .site-footer {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 0 24px 32px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .site-footer p {
      margin: 0;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .noscript {
      margin: 0;
      padding: 12px 24px;
      background: #fff4d6;
      color: #5f4200;
      text-align: center;
    }

    @media (max-width: 820px) {
      .page-layout {
        grid-template-columns: 1fr;
        padding-top: 24px;
      }

      .cart-panel {
        position: static;
      }
    }

    @media (max-width: 520px) {
      .header-inner {
        padding: 28px 18px 24px;
        gap: 16px;
      }

      .brand-badge {
        width: 58px;
        height: 58px;
        font-size: 1.55rem;
      }

      .page-layout {
        padding: 22px 18px 40px;
        gap: 22px;
      }

      .menu-card {
        gap: 12px;
        padding: 14px;
      }

      .menu-marker {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        font-size: 0.8rem;
      }

      .add-button {
        min-width: 74px;
        min-height: 46px;
        padding: 9px 15px;
      }

      .cart-panel {
        padding: 18px;
      }

      .site-footer {
        padding: 0 18px 26px;
      }
    }

    @media (max-width: 360px) {
      .brand-badge {
        display: none;
      }

      .menu-marker {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <p class="noscript">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งาน Suki Mini POS</p>
  </noscript>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-copy">
        <p class="eyebrow">ร้านสุกี้ขนาดเล็ก</p>
        <h1>Suki Mini POS</h1>
        <p class="subtitle">สำหรับพนักงานรับออร์เดอร์ — เลือกเมนู เพิ่มลงตะกร้า และตรวจสอบราคารวม</p>
      </div>
      <span class="brand-badge" aria-hidden="true">S</span>
    </div>
  </header>

  <main class="page-layout">
    <section aria-labelledby="menu-heading">
      <div class="section-heading">
        <p class="section-kicker">เมนู</p>
        <h2 id="menu-heading">เลือกสินค้า</h2>
      </div>
      <div id="menu-list" class="menu-list"></div>
    </section>

    <aside class="cart-panel" aria-labelledby="cart-heading">
      <div class="cart-heading-row">
        <div>
          <p class="section-kicker">รายการสั่ง</p>
          <h2 id="cart-heading">ตะกร้า</h2>
        </div>
        <button type="button" id="clear-cart" class="clear-button" disabled>ล้างตะกร้า</button>
      </div>

      <p id="empty-cart" class="empty-cart">ยังไม่มีสินค้าในตะกร้า</p>
      <ul id="cart-list" class="cart-list" aria-label="รายการสินค้าในตะกร้า" hidden></ul>

      <div class="total-row" role="status" aria-live="polite" aria-atomic="true">
        <span class="total-label">ราคารวม</span>
        <p class="total-amount"><span id="total-amount">0</span><span class="total-unit"> บาท</span></p>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <p>Suki Mini POS · สำหรับพนักงานรับออร์เดอร์</p>
  </footer>

  <script>
    const products = [
      { id: "pork-set", name: "ชุดหมู", price: 199, marker: "หมู", markerClass: "menu-marker--pork" },
      { id: "beef-set", name: "ชุดเนื้อ", price: 249, marker: "เนื้อ", markerClass: "menu-marker--beef" },
      { id: "water", name: "น้ำดื่ม", price: 20, marker: "น้ำ", markerClass: "menu-marker--drink" }
    ];

    const cart = new Map();
    const menuList = document.getElementById("menu-list");
    const cartList = document.getElementById("cart-list");
    const emptyCart = document.getElementById("empty-cart");
    const clearButton = document.getElementById("clear-cart");
    const totalAmount = document.getElementById("total-amount");
    const bahtFormatter = new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 });

    function formatBaht(amount) {
      return bahtFormatter.format(amount);
    }

    function getProduct(productId) {
      return products.find(function (product) {
        return product.id === productId;
      });
    }

    function renderMenu() {
      const fragment = document.createDocumentFragment();

      products.forEach(function (product) {
        const card = document.createElement("article");
        card.className = "menu-card";

        const marker = document.createElement("div");
        marker.className = "menu-marker " + product.markerClass;
        marker.setAttribute("aria-hidden", "true");
        marker.textContent = product.marker;

        const info = document.createElement("div");
        info.className = "menu-info";

        const name = document.createElement("h3");
        name.className = "menu-name";
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "menu-price";
        price.textContent = formatBaht(product.price) + " บาท";

        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className = "add-button";
        addButton.textContent = "เพิ่ม";
        addButton.setAttribute(
          "aria-label",
          "เพิ่ม" + product.name + " ราคา " + formatBaht(product.price) + " บาทลงตะกร้า"
        );
        addButton.addEventListener("click", function () {
          addToCart(product.id);
        });

        info.append(name, price);
        card.append(marker, info, addButton);
        fragment.append(card);
      });

      menuList.replaceChildren(fragment);
    }

    function getCartItems() {
      return products
        .filter(function (product) {
          return cart.has(product.id);
        })
        .map(function (product) {
          return {
            product: product,
            quantity: cart.get(product.id)
          };
        });
    }

    function renderCart() {
      const items = getCartItems();
      const fragment = document.createDocumentFragment();
      let total = 0;

      items.forEach(function (item) {
        total += item.product.price * item.quantity;

        const row = document.createElement("li");
        row.className = "cart-item";

        const name = document.createElement("span");
        name.className = "cart-item-name";
        name.textContent = item.product.name;

        const quantity = document.createElement("span");
        quantity.className = "cart-item-quantity";
        quantity.textContent = "จำนวน " + item.quantity;

        row.append(name, quantity);
        fragment.append(row);
      });

      const isEmpty = items.length === 0;
      cartList.replaceChildren(fragment);
      cartList.hidden = isEmpty;
      emptyCart.hidden = !isEmpty;
      clearButton.disabled = isEmpty;
      totalAmount.textContent = formatBaht(total);
    }

    function addToCart(productId) {
      if (!getProduct(productId)) {
        return;
      }

      cart.set(productId, (cart.get(productId) || 0) + 1);
      renderCart();
    }

    function clearCart() {
      cart.clear();
      renderCart();
    }

    clearButton.addEventListener("click", clearCart);

    renderMenu();
    renderCart();
  </script>
</body>
</html>
